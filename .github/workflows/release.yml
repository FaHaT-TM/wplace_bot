name: Build Windows Executable & Release

on:
  push:
    branches:
      - "arena/**"
      - "master"
    tags:
      - "v*"
  pull_request:
    branches:
      - "master"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create or update (e.g. v1.0.4)"
        required: false
        default: "v1.0.4"

permissions:
  contents: write

jobs:
  build-windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit test suite
        shell: pwsh
        run: |
          $out = pytest -v --tb=short 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $summary = ($out -split "`r?`n" | Select-Object -Last 35) -join "%0A"
            Write-Host "::error title=PytestFailure::$summary"
            exit $LASTEXITCODE
          }

      - name: Build standalone app.exe and wplace_bot.zip
        run: python scripts/build_release.py --require-windows-exe

      - name: Upload wplace_bot.zip workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wplace_bot-windows-x64
          path: |
            dist/wplace_bot.zip
            dist/app.exe

      - name: Publish or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $repo = "FaHaT-TM/wplace_bot"
          $token = $env:GH_TOKEN
          $apiHeaders = @{
            Authorization = "Bearer $token"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $tag = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}"
          } elseif ("${{ inputs.release_tag }}" -ne "") {
            "${{ inputs.release_tag }}"
          } else {
            "v1.0.4"
          }

          $notes = @"
          ## Place Bot $tag — Portable Windows Release & Core Package

          ### What's New in $tag
          - **Manual Counter Region Selection**: Two optional drag-to-select counter regions in the **Setup** tab — **Counter Region (Before Painting)** and **Counter Region (After Painting)** — persisted to `user_settings.json` and saved on exit, overriding the built-in preset counter regions per lifecycle mode.
          - **Auto-Sync Switch & Phase-Specific Counter Regions**: New **Auto-sync site pixel counter** toggle on the Control tab (persisted setting) gates all automatic syncs; startup and manual **Sync with Site** check only the first counter regions, while before-painting, stop, and after-painting phases check only the second (painting-mode) regions.
          - **Dedicated `logs/` & `debug/` Directories**: Daily UTF-8 diagnostic logs are now stored cleanly in `logs/placebot_YYYYMMDD.log` (with automatic log rotation up to `max_log_files`), and all debug/preview PNGs are stored in `debug/` (`debug/dry_run.png`, `debug/palette.png`, `debug/pixel_counter.png`, `debug/size_estimation.png`) so the root folder stays clean.
          - **Tools Menu Shortcuts & Logging Fixes**: Added **Open Logs Folder** and **Open Debug Folder** under `Tools`, fixed `Open Log File` path resolution for portable `app.exe`, added explicit UTF-8 log encoding, and fixed post-stop log reporting.
          - **Automatic Site Pixel Limit Sync (`available / total`) & Zero-Click Dry-Run**: Includes dual-monitor `wplace.live` pixel counter synchronization and live cursor-tracing Dry-Run preview.

          ### Included in `wplace_bot.zip`
          - **`app.exe`** — Standalone Windows x64 GUI executable built with PyInstaller (no Python installation required)
          - **`colors.json`** — Complete 63-color Wplace palette (including paintable `White`, `id: 64`)
          - **`config.json`** — Default application configuration (`max_pixel_limit = 5000`)
          - **`README.md`, `TASKS.md` & `LICENSE`** — Full usage guide, project roadmap, and MIT license
          - **`app.py`, `main.py`, `core/`, `gui/`, `requirements.txt`, `app.spec`** — Complete core Python source files

          ### Highlights
          - Pixel limit configurable from `1` up to `5,000` pixels with strict validation
          - Multi-monitor & HiDPI display scaling support across virtual desktop coordinates
          - Non-clicking **Dry-Run (Preview)** mode with per-color pixel counts, `ETA`, and visual diff overlay
          - **Persistent Painting Progress & Safe Resume** (`Resume Session` / `Reset Progress`) via atomic `session_progress.json` checkpoints
          - Instant **Emergency Stop** (`Stop` button, `ESC`, mouse movement, and screen-corner fail-safe)
          "@

          function Fail($message) {
            Write-Host "::error::$message"
            exit 1
          }

          # Resolve (create or update) the release via the REST API
          $release = $null
          try {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" -Headers $apiHeaders
          } catch {
            $release = $null
          }

          if ($null -eq $release) {
            $createBody = @{
              tag_name = $tag
              target_commitish = "${{ github.sha }}"
              name = "Place Bot $tag"
              body = $notes
              draft = $false
              prerelease = $false
            } | ConvertTo-Json
            try {
              $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases" -Method Post -Headers $apiHeaders -Body $createBody
            } catch {
              Fail "Release create API failed for $tag : $($_.Exception.Message)"
            }
          } else {
            $updateBody = @{
              draft = $false
              name = "Place Bot $tag"
              body = $notes
            } | ConvertTo-Json
            try {
              $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/$($release.id)" -Method Patch -Headers $apiHeaders -Body $updateBody
            } catch {
              Fail "Release update API failed for $tag : $($_.Exception.Message)"
            }
          }

          # Upload the release asset
          $assetPath = "dist/wplace_bot.zip"
          if (-not (Test-Path $assetPath)) {
            Fail "Release asset not found at $assetPath"
          }
          try {
            Invoke-RestMethod -Uri $release.upload_url -Method Post -Headers @{ Authorization = "Bearer $token" } -InFile $assetPath -ContentType "application/octet-stream" | Out-Null
          } catch {
            Fail "Release asset upload failed for $tag : $($_.Exception.Message)"
          }

          Write-Host "Published GitHub Release $tag with wplace_bot.zip"
