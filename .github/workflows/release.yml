name: Build Windows Executable & Release

on:
  push:
    branches:
      - "arena/**"
      - "master"
    tags:
      - "v*"
  pull_request:
    branches:
      - "master"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create or update (e.g. v1.0.4)"
        required: false
        default: "v1.0.4"

permissions:
  contents: write

jobs:
  build-windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit test suite
        shell: pwsh
        run: |
          $out = pytest -v --tb=short 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $summary = ($out -split "`r?`n" | Select-Object -Last 35) -join "%0A"
            Write-Host "::error title=PytestFailure::$summary"
            exit $LASTEXITCODE
          }

      - name: Build standalone app.exe and wplace_bot.zip
        run: python scripts/build_release.py --require-windows-exe

      - name: Upload wplace_bot.zip workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wplace_bot-windows-x64
          path: |
            dist/wplace_bot.zip
            dist/app.exe

      - name: Publish or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $repo = "FaHaT-TM/wplace_bot"
          $token = $env:GH_TOKEN
          $headers = @{
            Authorization = "Bearer $token"
            Accept = "application/vnd.github+json"
          }

          $tag = "${{ github.ref_name }}"
          Write-Host "::notice::Publish step started for tag $tag"

          $release = $null
          try {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" -Headers $headers
          } catch {
            $release = $null
          }

          if ($null -eq $release) {
            $body = @{
              tag_name = $tag
              target_commitish = "${{ github.sha }}"
              name = "Place Bot $tag"
              body = "Portable Windows release for Place Bot $tag"
              draft = $false
              prerelease = $false
            } | ConvertTo-Json
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases" -Method Post -Headers $headers -Body $body
          }

          Invoke-RestMethod -Uri $release.upload_url -Method Post -Headers @{ Authorization = "Bearer $token" } -InFile "dist/wplace_bot.zip" -ContentType "application/octet-stream" | Out-Null
          Write-Host "::notice::Published GitHub Release $tag with wplace_bot.zip"
